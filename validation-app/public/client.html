<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pesquisa de clientes — LimpaAí</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header><div class="wrap">
  <h1>Pesquisa com clientes</h1>
  <p>Entrevista de validação do LimpaAí.</p>
  <nav><a href="/">Início</a><a href="/professional.html">Profissionais</a><a href="/dashboard.html">Painel</a></nav>
</div></header>
<main>
  <div id="notice" class="notice"></div>
  <form id="research-form">
    <section class="card grid">
      <label>Cidade *<input name="city" required></label>
      <label>Bairro *<input name="neighborhood" required></label>
      <label>Nome ou código<input name="respondentCode"></label>
      <label>Faixa etária<select name="ageRange"><option value="">Selecione</option><option>18-29</option><option>30-39</option><option>40-49</option><option>50-59</option><option>60+</option></select></label>
      <label>Tipo de imóvel<select name="propertyType"><option value="">Selecione</option><option>Casa</option><option>Apartamento</option><option>Outro</option></select></label>
      <label>Pessoas na residência<input name="householdSize" type="number" min="1"></label>
    </section>

    <section class="card grid">
      <label>Já contratou limpeza? *
        <select name="usedCleaningService" required><option value="">Selecione</option><option>Sim</option><option>Não</option></select>
      </label>
      <label>Dificuldade para encontrar profissional
        <select name="findingDifficulty"><option value="">Selecione</option><option>Alta</option><option>Média</option><option>Baixa</option><option>Nenhuma</option></select>
      </label>
      <label>Contrataria pela plataforma? *
        <select name="platformInterest" required><option value="">Selecione</option><option>Sim</option><option>Talvez</option><option>Não</option></select>
      </label>
      <label>Aceita taxa de 10%?
        <select name="acceptsTenPercentFee"><option value="">Selecione</option><option>Sim</option><option>Talvez</option><option>Não</option></select>
      </label>
      <label>Aceita pagamento antecipado?
        <select name="acceptsPrepaid"><option value="">Selecione</option><option>Sim</option><option>Talvez</option><option>Não</option></select>
      </label>
      <label>Participaria do piloto?
        <select name="pilotInterest"><option value="">Selecione</option><option>Sim</option><option>Talvez</option><option>Não</option></select>
      </label>
    </section>

    <section class="card">
      <fieldset>
        <legend>O que mais pesa na escolha?</legend>
        <div class="checks">
          <label><input type="checkbox" name="priorities" value="Confiança"> Confiança</label>
          <label><input type="checkbox" name="priorities" value="Segurança"> Segurança</label>
          <label><input type="checkbox" name="priorities" value="Indicação"> Indicação</label>
          <label><input type="checkbox" name="priorities" value="Preço"> Preço</label>
          <label><input type="checkbox" name="priorities" value="Experiência"> Experiência</label>
          <label><input type="checkbox" name="priorities" value="Disponibilidade"> Disponibilidade</label>
          <label><input type="checkbox" name="priorities" value="Avaliações"> Avaliações</label>
        </div>
      </fieldset>
    </section>

    <section class="card grid">
      <label>Preço justo — faxina padrão<input name="fairPriceStandard" type="number" min="0" step="0.01"></label>
      <label>Preço justo — faxina pesada<input name="fairPriceHeavy" type="number" min="0" step="0.01"></label>
      <label>Preço justo — organização<input name="fairPriceOrganization" type="number" min="0" step="0.01"></label>
      <label>Preço justo — passar roupas<input name="fairPriceIroning" type="number" min="0" step="0.01"></label>
      <label>Forma preferida<select name="matchingPreference"><option value="">Selecione</option><option>Escolher profissional</option><option>Receber candidaturas</option><option>Receber recomendação</option></select></label>
      <label>Fornece produtos?<select name="providesProducts"><option value="">Selecione</option><option>Sim</option><option>Não</option><option>Depende</option></select></label>
    </section>

    <section class="card">
      <label>Maior dificuldade ou problema<textarea name="mainProblem"></textarea></label>
      <label>Maior receio com a plataforma<textarea name="mainConcern"></textarea></label>
      <label>Observações<textarea name="notes"></textarea></label>
      <label>Contato autorizado<input name="authorizedContact"></label>
    </section>

    <button class="primary" type="submit">Registrar resposta</button>
  </form>
</main>
<script src="/common.js"></script>
<script>
  const form = document.querySelector("#research-form");
  const notice = document.querySelector("#notice");
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    submitResearchForm(form, "clients", notice);
  });
</script>
</body>
</html>
